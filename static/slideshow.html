<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"/>
<title>湯畑 案内板</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    display: flex;
    align-items: center;
  }

  #container {
    display: flex;
    width: 100vw;
    height: 100vh;
    align-items: flex-end;
  }

  /* 左: 温度表示 */
  #left {
    width: 70%;
    height: 90vh;
    flex-shrink: 0;
  }
  #left iframe {
    width: 100%;
    height: 100%;
    border: none;
  }

  /* 右: 3Dカルーセル */
  #right {
    width: 30%;
    height: 90vh;
    position: relative;
    overflow: visible;
    background: #0a0a0a;
    perspective: 500px;
    perspective-origin: 50% 50%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .slide {
    position: absolute;
    width: 92%;
    height: 58%;
    border-radius: 40px;  /* 上下に丸み */
    overflow: hidden;
    transition: transform 0.85s cubic-bezier(.4,0,.2,1),
                opacity   0.85s cubic-bezier(.4,0,.2,1),
                box-shadow 0.85s ease;
    backface-visibility: hidden;
  }
  .slide img {
    width: 100%; height: 100%;
    object-fit: contain;
    display: block;
    background: #0a0a0a;
  }

  /* 前面（アクティブ） */
  .slide[data-pos="0"] {
    transform: scale(1);
    opacity: 1;
    z-index: 3;
    box-shadow: 0 24px 60px rgba(0,0,0,0.9),
                0 0 0 1px rgba(255,255,255,0.15);
  }
  /* 上奥（縦回転） */
  .slide[data-pos="1"] {
    transform: translateY(-40%) rotateX(-48deg) translateZ(-60px) scale(0.75);
    opacity: 0.5;
    z-index: 2;
    box-shadow: 0 12px 30px rgba(0,0,0,0.7);
  }
  /* 下奥（縦回転） */
  .slide[data-pos="2"] {
    transform: translateY(40%) rotateX(48deg) translateZ(-60px) scale(0.75);
    opacity: 0.5;
    z-index: 1;
    box-shadow: 0 12px 30px rgba(0,0,0,0.7);
  }

  #bar {
    position: absolute;
    bottom: 0; left: 0;
    height: 4px;
    background: rgba(255,255,255,0.7);
    width: 0%;
    z-index: 99;
  }

  #dots {
    position: absolute;
    bottom: 12px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 10px;
    z-index: 99;
  }
  .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: rgba(255,255,255,0.3);
    transition: background 0.3s, transform 0.3s;
  }
  .dot.on {
    background: rgba(255,255,255,0.9);
    transform: scale(1.3);
    box-shadow: 0 0 6px rgba(255,255,255,0.7);
  }
</style>
</head>
<body>

<div id="container">

  <!-- 左: 温度表示（常時固定） -->
  <div id="left">
    <iframe src="/base7"></iframe>
  </div>

  <!-- 右: 3Dカルーセル -->
  <div id="right">
    <div class="slide" data-pos="0">
      <img src="/static/ChatGPT Image May 15, 2026, 08_26_50 PM.png" alt="静止画1">
    </div>
    <div class="slide" data-pos="1">
      <img src="/static/ChatGPT Image May 23, 2026, 11_16_35 PM.png" alt="静止画2">
    </div>
    <div class="slide" data-pos="2">
      <img src="/static/ChatGPT Image May 23, 2026, 11_26_28 PM.png" alt="静止画3">
    </div>

    <div id="bar"></div>
    <div id="dots">
      <div class="dot on"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
  </div>

</div>

<script>
const DURATION = 10;
const slides = document.querySelectorAll('#right .slide');
const dots   = document.querySelectorAll('#dots .dot');
const bar    = document.getElementById('bar');
let front = 0;
let startTime, raf, timer;

function applyPositions() {
  slides.forEach((slide, i) => {
    slide.dataset.pos = (i - front + slides.length) % slides.length;
  });
  dots.forEach((dot, i) => {
    dot.classList.toggle('on', i === front);
  });
}

function advance() {
  front = (front + 1) % slides.length;
  applyPositions();
  startProgress();
}

function startProgress() {
  clearTimeout(timer);
  cancelAnimationFrame(raf);
  startTime = Date.now();
  const dur = DURATION * 1000;
  function tick() {
    const pct = Math.min((Date.now() - startTime) / dur * 100, 100);
    bar.style.width = pct + '%';
    if (pct < 100) raf = requestAnimationFrame(tick);
  }
  tick();
  timer = setTimeout(advance, dur);
}

applyPositions();
startProgress();
</script>
</body>
</html>
