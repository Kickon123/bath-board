<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"/>
<title>湯畑 案内板</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    display: flex;
    align-items: center; /* 上下中央に配置 */
  }

  /* 画像アスペクト比 1514:781 に合わせた高さ（左半分=50vwの高さ）*/
  #container {
    display: flex;
    width: 100vw;
    height: calc(50vw * 781 / 1514);
    max-height: 100vh;
  }

  /* 左: 温度表示（固定） */
  #left {
    width: 50%;
    height: 100%;
    flex-shrink: 0;
  }
  #left iframe {
    width: 100%;
    height: 100%;
    border: none;
  }

  /* 右: 縦回転スライドショー */
  #right {
    width: 50%;
    height: 100%;
    position: relative;
    overflow: hidden;
    perspective: 1200px;
  }

  .slide {
    position: absolute;
    inset: 0;
    opacity: 0;
    pointer-events: none;
    backface-visibility: hidden;
  }
  .slide.active {
    opacity: 1;
    pointer-events: auto;
  }
  .slide img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
  }

  @keyframes exitRotate {
    0%   { opacity: 1; transform: rotateX(0deg)    scale(1);   }
    100% { opacity: 0; transform: rotateX(-120deg) scale(0.6); }
  }
  @keyframes enterRotate {
    0%   { opacity: 0; transform: rotateX(120deg) scale(0.6); }
    100% { opacity: 1; transform: rotateX(0deg)   scale(1);   }
  }

  .slide.exiting {
    animation: exitRotate 0.65s cubic-bezier(.4,0,.2,1) forwards;
  }
  .slide.entering {
    animation: enterRotate 0.65s cubic-bezier(.4,0,.2,1) forwards;
  }

  #bar {
    position: absolute;
    bottom: 0; left: 0;
    height: 4px;
    background: rgba(255,255,255,0.75);
    width: 0%;
    z-index: 99;
  }

  #dots {
    position: absolute;
    bottom: 12px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 10px;
    z-index: 99;
  }
  .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: rgba(255,255,255,0.35);
    transition: background 0.3s;
  }
  .dot.on {
    background: rgba(255,255,255,0.9);
    box-shadow: 0 0 6px rgba(255,255,255,0.8);
  }
</style>
</head>
<body>

<div id="container">

  <!-- 左: 温度表示（常時固定） -->
  <div id="left">
    <iframe src="/base7"></iframe>
  </div>

  <!-- 右: 縦回転スライドショー -->
  <div id="right">
    <div class="slide active" id="s0">
      <img src="/static/base7.png" alt="湯畑マップ">
    </div>
    <div class="slide" id="s1">
      <img src="/static/bg.png" alt="背景1">
    </div>
    <div class="slide" id="s2">
      <img src="/static/bg.png" alt="背景2">
    </div>

    <div id="bar"></div>
    <div id="dots">
      <div class="dot on"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
  </div>

</div>

<script>
const DURATION = 10;
const ANIM_MS  = 650;

const slides = document.querySelectorAll('#right .slide');
const dots   = document.querySelectorAll('#dots .dot');
const bar    = document.getElementById('bar');
let current  = 0;
let startTime, raf, timer;

function showNext() {
  const prev = current;
  current = (current + 1) % slides.length;

  slides[prev].classList.remove('active');
  slides[prev].classList.add('exiting');
  setTimeout(() => slides[prev].classList.remove('exiting'), ANIM_MS);

  slides[current].classList.add('entering', 'active');
  setTimeout(() => slides[current].classList.remove('entering'), ANIM_MS);

  dots[prev].classList.remove('on');
  dots[current].classList.add('on');

  startProgress();
}

function startProgress() {
  clearTimeout(timer);
  cancelAnimationFrame(raf);
  startTime = Date.now();
  const dur = DURATION * 1000;

  function tick() {
    const pct = Math.min((Date.now() - startTime) / dur * 100, 100);
    bar.style.width = pct + '%';
    if (pct < 100) raf = requestAnimationFrame(tick);
  }
  tick();
  timer = setTimeout(showNext, dur);
}

startProgress();
</script>
</body>
</html>
