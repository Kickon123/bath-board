<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
<title>スタッフモニター</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  :root{
    --bg:#f4f6f9;--card:#ffffff;--border:#e2e8f0;
    --ok:#16a34a;--warn:#d97706;--hot:#ea580c;--cold:#0284c7;--ng:#dc2626;--off:#94a3b8;
    --text:#1e293b;--sub:#64748b;--accent:#4f46e5;
  }
  body{background:var(--bg);color:var(--text);
    font-family:'Hiragino Kaku Gothic Pro','Yu Gothic',sans-serif;
    min-height:100dvh;padding-bottom:env(safe-area-inset-bottom,16px);}

  /* ── ヘッダー ── */
  #header{position:sticky;top:0;z-index:20;background:var(--bg);
    padding:14px 16px 12px;border-bottom:1px solid var(--border);
    display:flex;align-items:center;justify-content:space-between;}
  #header-left h1{font-size:1.05rem;font-weight:700;letter-spacing:.04em;}
  #header-left .sub{font-size:.72rem;color:var(--sub);margin-top:2px;}
  #sys-badge{display:flex;align-items:center;gap:5px;font-size:.78rem;font-weight:700;
    padding:6px 12px;border-radius:999px;transition:all .4s;}
  #sys-badge.ok  {background:#dcfce7;color:var(--ok); border:1.5px solid #86efac;}
  #sys-badge.warn{background:#fef3c7;color:var(--warn);border:1.5px solid #fcd34d;}
  #sys-badge.ng  {background:#fee2e2;color:var(--ng); border:1.5px solid #fca5a5;
    animation:pulse 1.4s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

  /* ── 更新バー ── */
  #update-bar{padding:8px 16px;display:flex;align-items:center;justify-content:space-between;
    font-size:.72rem;color:var(--sub);border-bottom:1px solid var(--border);}
  #last-time{color:var(--accent);font-weight:600;font-variant-numeric:tabular-nums;}
  #progress-wrap{display:flex;align-items:center;gap:6px;font-size:.68rem;}
  #progress-bar{width:56px;height:3px;background:var(--border);border-radius:2px;overflow:hidden;}
  #progress-fill{height:100%;background:var(--accent);border-radius:2px;transition:width 1s linear;}

  /* ── 全体グラフボタン ── */
  #overall-btn{
    display:flex;align-items:center;justify-content:center;gap:6px;
    margin:12px 12px 4px;padding:12px;
    background:var(--card);border:1.5px solid var(--border);border-radius:12px;
    font-size:.88rem;font-weight:700;color:var(--accent);cursor:pointer;
    transition:background .15s;
  }
  #overall-btn:active{background:#eef2ff;}

  /* ── 湯舟カード ── */
  #bath-list{padding:8px 12px 4px;}
  .bath-card{border-radius:14px;margin-bottom:10px;background:var(--card);
    border:1px solid var(--border);border-left-width:5px;overflow:hidden;
    cursor:pointer;transition:opacity .15s;}
  .bath-card:active{opacity:.75;}
  .bath-card.ok  {border-left-color:var(--ok);}
  .bath-card.warn{border-left-color:var(--warn);}
  .bath-card.hot {border-left-color:var(--hot);}
  .bath-card.cold{border-left-color:var(--cold);}
  .bath-card.off {border-left-color:var(--off);}
  .bath-inner{padding:14px 16px 12px;}
  .bath-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
  .bath-name{font-size:1.05rem;font-weight:700;letter-spacing:.03em;}
  .bath-hint{font-size:.62rem;color:var(--sub);margin-top:1px;}
  .status-pill{font-size:.72rem;font-weight:700;padding:4px 11px;border-radius:999px;white-space:nowrap;}
  .pill-ok  {background:#dcfce7;color:var(--ok);}
  .pill-warn{background:#fef3c7;color:var(--warn);}
  .pill-hot {background:#ffedd5;color:var(--hot);}
  .pill-cold{background:#e0f2fe;color:var(--cold);}
  .pill-off {background:#f1f5f9; color:var(--off);}
  .bath-temp-row{display:flex;align-items:baseline;gap:6px;margin-bottom:6px;}
  .bath-temp{font-size:3.8rem;font-weight:800;line-height:1;
    font-variant-numeric:tabular-nums;letter-spacing:-.02em;}
  .bath-temp.ok  {color:var(--ok);}  .bath-temp.warn{color:var(--warn);}
  .bath-temp.hot {color:var(--hot);} .bath-temp.cold{color:var(--cold);}
  .bath-temp.off {color:var(--off);}
  .bath-unit{font-size:1.4rem;font-weight:500;color:var(--sub);}
  .bath-diff{font-size:.85rem;font-weight:600;padding:2px 7px;border-radius:6px;align-self:center;}
  .diff-over {background:#ffedd5;color:var(--hot);}
  .diff-under{background:#e0f2fe;color:var(--cold);}
  .bath-bottom{display:flex;align-items:center;justify-content:space-between;}
  .bath-target{font-size:.76rem;color:var(--sub);}
  .bath-age{font-size:.72rem;color:var(--sub);font-variant-numeric:tabular-nums;}
  .bath-age.stale{color:var(--warn);}

  /* ── 外気温・システム ── */
  .section-label{font-size:.65rem;font-weight:700;letter-spacing:.12em;
    color:var(--sub);padding:8px 16px 4px;}
  #ambient-card,#sysinfo-card{margin:0 12px 10px;padding:14px 16px;
    background:var(--card);border:1px solid var(--border);border-radius:14px;}
  #ambient-card{display:flex;align-items:center;gap:20px;}
  .amb-item .lbl{font-size:.72rem;color:var(--sub);margin-bottom:2px;}
  .amb-item .val{font-size:1.8rem;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums;}
  .amb-item .val.hum{font-size:1.4rem;color:#0284c7;}
  .sysinfo-row{display:flex;justify-content:space-between;align-items:center;
    padding:7px 0;font-size:.82rem;border-bottom:1px solid var(--border);}
  .sysinfo-row:last-child{border-bottom:none;}
  .sysinfo-row .key{color:var(--sub);}
  .sysinfo-row .val{font-weight:700;font-variant-numeric:tabular-nums;}
  .v-ok{color:var(--ok);} .v-warn{color:var(--warn);} .v-ng{color:var(--ng);} .v-sub{color:var(--sub);}
  #clock{text-align:center;padding:10px 0 6px;font-size:.72rem;color:var(--sub);font-variant-numeric:tabular-nums;}

  /* ── モーダル共通 ── */
  .modal{display:none;position:fixed;inset:0;z-index:100;flex-direction:column;justify-content:flex-end;}
  .modal.open{display:flex;}
  .modal-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.45);}
  .modal-sheet{position:relative;z-index:1;background:#fff;border-radius:20px 20px 0 0;
    max-height:90dvh;display:flex;flex-direction:column;
    border-top:1px solid var(--border);animation:slideUp .22s ease-out;}
  @keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
  .modal-handle{width:36px;height:4px;background:#e2e8f0;border-radius:2px;margin:10px auto 0;}
  .modal-header{display:flex;align-items:center;justify-content:space-between;
    padding:14px 18px 10px;border-bottom:1px solid var(--border);flex-shrink:0;}
  .modal-title{font-size:1.1rem;font-weight:700;}
  .modal-close{background:#f1f5f9;border:none;color:var(--text);width:30px;height:30px;
    border-radius:50%;font-size:.9rem;cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .modal-body{overflow-y:auto;flex:1;padding-bottom:16px;}

  /* チャート */
  .chart-wrap{padding:14px 10px 6px;}
  .chart-label{font-size:.7rem;color:var(--sub);margin-bottom:6px;padding:0 4px;}
  .chart-svg{width:100%;display:block;}

  /* 凡例（全体グラフ用） */
  #legend-wrap{display:flex;flex-wrap:wrap;gap:8px 14px;padding:6px 14px 10px;}
  .legend-item{display:flex;align-items:center;gap:5px;font-size:.75rem;color:var(--text);}
  .legend-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}

  /* 履歴テーブル */
  .hist-section{padding:0 12px;}
  .hist-label{font-size:.65rem;font-weight:700;letter-spacing:.1em;
    color:var(--sub);padding:6px 4px 4px;}
  .hist-table{width:100%;border-collapse:collapse;font-size:.8rem;}
  .hist-table th{color:var(--sub);font-weight:600;text-align:left;
    padding:5px 8px;border-bottom:1px solid var(--border);}
  .hist-table td{padding:7px 8px;border-bottom:1px solid #f1f5f9;font-variant-numeric:tabular-nums;}
  .hist-table tr:last-child td{border-bottom:none;}
  .td-ok  {color:var(--ok);}  .td-hot {color:var(--hot);}
  .td-cold{color:var(--cold);}.td-warn{color:var(--warn);}
  .td-off {color:var(--off);}
  .no-data{padding:28px;text-align:center;color:var(--sub);font-size:.85rem;}
</style>
</head>
<body>

<div id="header">
  <div id="header-left">
    <h1>スタッフモニター</h1>
    <div class="sub">花つばき 湯畑・大浴場</div>
  </div>
  <div id="sys-badge" class="ok">● 確認中</div>
</div>

<div id="update-bar">
  <div>最終更新 <span id="last-time">--:--:--</span> <span id="last-ago"></span></div>
  <div id="progress-wrap">
    <span>次回</span>
    <div id="progress-bar"><div id="progress-fill" style="width:100%"></div></div>
  </div>
</div>

<div id="overall-btn" onclick="openOverallModal()">
  📈 全体グラフを見る
</div>

<div id="bath-list"></div>

<div class="section-label">外気温</div>
<div id="ambient-card">
  <div class="amb-item">
    <div class="lbl">気温</div>
    <div class="val" id="amb-temp">--.-℃</div>
  </div>
  <div class="amb-item" id="amb-hum-wrap" style="display:none">
    <div class="lbl">湿度</div>
    <div class="val hum" id="amb-hum">--%</div>
  </div>
</div>

<div class="section-label">システム</div>
<div id="sysinfo-card">
  <div class="sysinfo-row">
    <span class="key">データ受信</span>
    <span class="val" id="si-push">--</span>
  </div>
  <div class="sysinfo-row">
    <span class="key">センサー数</span>
    <span class="val v-sub" id="si-count">--</span>
  </div>
  <div class="sysinfo-row">
    <span class="key">要確認</span>
    <span class="val" id="si-stale">--</span>
  </div>
</div>

<div id="clock"></div>

<!-- 個別履歴モーダル -->
<div id="bath-modal" class="modal">
  <div class="modal-backdrop"></div>
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-header">
      <div>
        <div class="modal-title" id="bath-modal-title">--</div>
        <div style="font-size:.75rem;color:var(--sub);margin-top:2px" id="bath-modal-target"></div>
      </div>
      <div style="display:flex;align-items:center;gap:10px;">
        <span id="bath-modal-current" style="font-size:1.6rem;font-weight:800;font-variant-numeric:tabular-nums;"></span>
        <button class="modal-close" onclick="closeModal('bath-modal')">✕</button>
      </div>
    </div>
    <div class="modal-body">
      <div class="chart-wrap">
        <div class="chart-label">温度推移</div>
        <svg id="bath-chart" class="chart-svg" viewBox="0 0 320 150"></svg>
      </div>
      <div class="hist-section">
        <div class="hist-label">履歴（新しい順）</div>
        <div id="bath-no-data" class="no-data" style="display:none">データがまだありません</div>
        <table class="hist-table" id="bath-hist-table">
          <thead><tr><th>時刻</th><th>温度</th><th>状態</th></tr></thead>
          <tbody id="bath-hist-tbody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- 全体グラフモーダル -->
<div id="overall-modal" class="modal">
  <div class="modal-backdrop"></div>
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-header">
      <div class="modal-title">全湯舟 温度推移</div>
      <button class="modal-close" onclick="closeModal('overall-modal')">✕</button>
    </div>
    <div class="modal-body">
      <div class="chart-wrap">
        <div class="chart-label" id="overall-chart-label">直近のデータを表示中</div>
        <svg id="overall-chart" class="chart-svg" viewBox="0 0 320 180"></svg>
      </div>
      <div id="legend-wrap"></div>
      <div id="overall-no-data" class="no-data" style="display:none">データがまだありません</div>
    </div>
  </div>
</div>

<script>
"use strict";

const REFRESH = 10;
let tickTimer = null, tickStart = Date.now();
let lastData  = null, bathsData = [];

// 湯舟ごとの色（全体グラフ用）
const BATH_COLORS = {
  1: "#ef4444", 2: "#f97316", 3: "#3b82f6",
  5: "#8b5cf6", 6: "#22c55e", 20: "#06b6d4", 21: "#ec4899",
};
function bathColor(id){ return BATH_COLORS[id] || "#94a3b8"; }

function pad(n){ return String(n).padStart(2,"0"); }
function fmtTime(iso){
  if(!iso) return "--:--:--";
  const d=new Date(iso); return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}
function fmtShort(iso){
  if(!iso) return "--";
  const d=new Date(iso); return `${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function agoText(iso){
  if(!iso) return "";
  const s=Math.floor((Date.now()-new Date(iso))/1000);
  if(s<60) return `${s}秒前`; if(s<3600) return `${Math.floor(s/60)}分前`;
  return `${Math.floor(s/3600)}時間前`;
}
function parseTarget(s){
  if(!s) return null;
  const m=s.match(/(\d+(?:\.\d+)?)[〜~\-−](\d+(?:\.\d+)?)/);
  return m ? {lo:parseFloat(m[1]),hi:parseFloat(m[2])} : null;
}
function calcStatus(temp,stale,tgt){
  if(stale||temp==null) return {key:"off",label:"データなし"};
  if(!tgt)              return {key:"ok", label:"取得中 ✓"};
  const over=temp-tgt.hi, under=tgt.lo-temp;
  if(over >2) return {key:"hot", label:"高め ⚠",  diff:`+${over.toFixed(1)}℃`};
  if(under>2) return {key:"cold",label:"低め ⚠",  diff:`-${under.toFixed(1)}℃`};
  if(over >0) return {key:"warn",label:"やや高め", diff:`+${over.toFixed(1)}℃`};
  if(under>0) return {key:"warn",label:"やや低め", diff:`-${under.toFixed(1)}℃`};
  return            {key:"ok",  label:"正常 ✓"};
}

// ── 湯舟カード描画 ────────────────────────────────
function renderBaths(baths){
  bathsData = baths;
  document.getElementById("bath-list").innerHTML = baths.map(b => {
    const tgt=parseTarget(b.target||""), st=calcStatus(b.temp,b.stale,tgt);
    const hasT=b.temp!=null;
    const diffHtml=st.diff?`<span class="bath-diff ${st.diff[0]==='+'?'diff-over':'diff-under'}">${st.diff}</span>`:"";
    return `
    <div class="bath-card ${st.key}" onclick="openBathModal(${b.id})">
      <div class="bath-inner">
        <div class="bath-top">
          <div><div class="bath-name">${b.name}</div><div class="bath-hint">タップで履歴・グラフ</div></div>
          <span class="status-pill pill-${st.key}">${st.label}</span>
        </div>
        <div class="bath-temp-row">
          <span class="bath-temp ${st.key}">${hasT?Number(b.temp).toFixed(1):"--.-"}</span>
          <span class="bath-unit">${hasT?"℃":""}</span>${diffHtml}
        </div>
        <div class="bath-bottom">
          <span class="bath-target">目標 ${b.target||"未設定"}</span>
          <span class="bath-age${b.stale?" stale":""}">${b.at?agoText(b.at):"時刻不明"}</span>
        </div>
      </div>
    </div>`;
  }).join("");
}

function renderAmbient(gw){
  if(!gw||gw.temp==null){document.getElementById("amb-temp").textContent="--.-℃";
    document.getElementById("amb-hum-wrap").style.display="none"; return;}
  document.getElementById("amb-temp").textContent=Number(gw.temp).toFixed(1)+"℃";
  if(gw.humidity!=null){
    document.getElementById("amb-hum").textContent=Number(gw.humidity).toFixed(1)+"%";
    document.getElementById("amb-hum-wrap").style.display="";
  }
}

function renderSystem(data){
  const baths=data.baths||[], online=data.online!==false;
  const staleN=baths.filter(b=>b.stale||b.temp==null).length;
  const badge=document.getElementById("sys-badge");
  if(!online)       {badge.textContent="● 未接続";badge.className="ng";}
  else if(staleN>0) {badge.textContent="● 要確認";badge.className="warn";}
  else              {badge.textContent="● 正常";  badge.className="ok";}
  document.getElementById("last-time").textContent=fmtTime(data.last_updated);
  document.getElementById("last-ago").textContent=data.last_updated?`(${agoText(data.last_updated)})`:"";
  document.getElementById("si-push").textContent=online?fmtTime(data.last_updated):"--:--:--";
  document.getElementById("si-push").className="val "+(online?"v-ok":"v-ng");
  document.getElementById("si-count").textContent=baths.length+" 台";
  document.getElementById("si-stale").textContent=staleN>0?staleN+" 台":"なし";
  document.getElementById("si-stale").className="val "+(staleN>0?"v-warn":"v-ok");
}

// ── チックバー ────────────────────────────────────
function startTick(){
  clearInterval(tickTimer); tickStart=Date.now();
  tickTimer=setInterval(()=>{
    const pct=Math.max(0,100-(Date.now()-tickStart)/1000/REFRESH*100);
    document.getElementById("progress-fill").style.width=pct+"%";
  },500);
}

async function load(){
  try{
    const res=await fetch("/api/baths"), data=await res.json();
    lastData=data; renderBaths(data.baths||[]); renderAmbient(data.gateway); renderSystem(data);
  }catch{
    document.getElementById("sys-badge").textContent="● 通信エラー";
    document.getElementById("sys-badge").className="ng";
  }
  startTick();
}

// ── 時計 ─────────────────────────────────────────
function updateClock(){
  const d=new Date(),days=["日","月","火","水","木","金","土"];
  document.getElementById("clock").textContent=
    `${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())}（${days[d.getDay()]}） ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  if(lastData) document.getElementById("last-ago").textContent=
    lastData.last_updated?`(${agoText(lastData.last_updated)})`:"";
}

// ── Y軸スケール計算（0.1℃単位まで対応）──────────
function calcYScale(temps){
  const rawMin=Math.min(...temps), rawMax=Math.max(...temps);
  const rawRange=rawMax-rawMin;
  // データ幅に対してタイトなマージン
  const margin=Math.max(0.3, rawRange*0.15);
  const yMin=Math.round((rawMin-margin)*10)/10;
  const yMax=Math.round((rawMax+margin)*10)/10;
  const yR=yMax-yMin||0.5;
  // ステップを範囲に応じて自動決定
  let step;
  if(yR<=0.8)      step=0.2;
  else if(yR<=2)   step=0.5;
  else if(yR<=5)   step=1;
  else             step=2;
  const fmtY=v=>step<1?v.toFixed(1):String(Math.round(v));
  return {yMin,yMax,yR,step,fmtY};
}

// ── SVGチャート（単一湯舟）────────────────────────
function drawSingleChart(svgEl, points, _unused, color="#4f46e5"){
  const W=320,H=150,PAD={t:22,r:14,b:28,l:42};
  const cw=W-PAD.l-PAD.r, ch=H-PAD.t-PAD.b;
  const temps=points.map(p=>p.temp).filter(t=>t!=null);
  if(!temps.length){svgEl.innerHTML="";return;}

  const {yMin,yMax,yR,step,fmtY}=calcYScale(temps);
  const tx=i=>PAD.l+(i/(points.length-1||1))*cw;
  const ty=t=>PAD.t+(1-(t-yMin)/yR)*ch;

  let h="";
  // グリッド＋Y軸ラベル
  for(let t=yMin;t<=yMax+step*0.01;t=Math.round((t+step)*10)/10){
    const y=ty(t);
    if(y<PAD.t-2||y>H-PAD.b+2) continue;
    h+=`<line x1="${PAD.l}" y1="${y}" x2="${W-PAD.r}" y2="${y}" stroke="rgba(0,0,0,.07)" stroke-width="1"/>`;
    h+=`<text x="${PAD.l-4}" y="${y+4}" text-anchor="end" fill="#94a3b8" font-size="9">${fmtY(t)}</text>`;
  }
  // ライン
  const pts=points.map((p,i)=>p.temp!=null?`${tx(i)},${ty(p.temp)}`:null).filter(Boolean);
  if(pts.length>1)
    h+=`<polyline points="${pts.join(" ")}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  // ドット＋最新値ラベル
  points.forEach((p,i)=>{
    if(p.temp==null)return;
    const cx=tx(i),cy=ty(p.temp),last=i===points.length-1;
    h+=`<circle cx="${cx}" cy="${cy}" r="${last?5:2.5}" fill="${last?"#fff":color}" stroke="${color}" stroke-width="${last?2:0}"/>`;
    if(last) h+=`<text x="${cx}" y="${cy-9}" text-anchor="middle" fill="${color}" font-size="10" font-weight="700">${p.temp.toFixed(1)}℃</text>`;
  });
  // X軸ラベル
  const step2=Math.max(1,Math.floor(points.length/4));
  points.forEach((p,i)=>{
    if(i%step2!==0&&i!==points.length-1)return;
    h+=`<text x="${tx(i)}" y="${H-4}" text-anchor="middle" fill="#94a3b8" font-size="8">${fmtShort(p.at)}</text>`;
  });
  svgEl.innerHTML=h;
}

// ── SVGチャート（全湯舟）─────────────────────────
function drawOverallChart(svgEl, allData){
  const W=320,H=180,PAD={t:22,r:14,b:28,l:40};
  const cw=W-PAD.l-PAD.r, ch=H-PAD.t-PAD.b;

  // 湯舟ごとにグループ化
  const groups={};
  for(const r of allData){
    if(r.temp==null||r.stale) continue;
    if(!groups[r.bath_id]) groups[r.bath_id]={name:r.bath_name,pts:[]};
    groups[r.bath_id].pts.push({at:r.at,temp:r.temp});
  }
  const ids=Object.keys(groups);
  if(!ids.length){svgEl.innerHTML="";return;}

  // 全データの時刻軸を統一
  const allTimes=[...new Set(allData.map(r=>r.at))].sort();
  const timeIdx=Object.fromEntries(allTimes.map((t,i)=>[t,i]));
  const n=allTimes.length;

  const allTemps=Object.values(groups).flatMap(g=>g.pts.map(p=>p.temp));
  const {yMin,yMax,yR,step,fmtY}=calcYScale(allTemps);
  const tx=i=>PAD.l+(i/(n-1||1))*cw;
  const ty=t=>PAD.t+(1-(t-yMin)/yR)*ch;

  let h="";
  for(let t=yMin;t<=yMax+step*0.01;t=Math.round((t+step)*10)/10){
    const y=ty(t);
    if(y<PAD.t-2||y>H-PAD.b+2) continue;
    h+=`<line x1="${PAD.l}" y1="${y}" x2="${W-PAD.r}" y2="${y}" stroke="rgba(0,0,0,.07)" stroke-width="1"/>`;
    h+=`<text x="${PAD.l-4}" y="${y+4}" text-anchor="end" fill="#94a3b8" font-size="9">${fmtY(t)}</text>`;
  }

  for(const id of ids){
    const g=groups[id], c=bathColor(Number(id));
    const pts=g.pts.map(p=>{const xi=timeIdx[p.at];return xi!==undefined?`${tx(xi)},${ty(p.temp)}`:null;}).filter(Boolean);
    if(pts.length>1)
      h+=`<polyline points="${pts.join(" ")}" fill="none" stroke="${c}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" opacity=".85"/>`;
    if(g.pts.length){
      const last=g.pts[g.pts.length-1];
      const xi=timeIdx[last.at];
      if(xi!==undefined){
        h+=`<circle cx="${tx(xi)}" cy="${ty(last.temp)}" r="4" fill="#fff" stroke="${c}" stroke-width="2"/>`;
        h+=`<text x="${tx(xi)}" y="${ty(last.temp)-8}" text-anchor="middle" fill="${c}" font-size="9" font-weight="700">${last.temp.toFixed(1)}</text>`;
      }
    }
  }

  // X軸ラベル
  const step2=Math.max(1,Math.floor(n/4));
  allTimes.forEach((t,i)=>{
    if(i%step2!==0&&i!==n-1)return;
    h+=`<text x="${tx(i)}" y="${H-4}" text-anchor="middle" fill="#94a3b8" font-size="8">${fmtShort(t)}</text>`;
  });
  svgEl.innerHTML=h;

  // 凡例
  const legendEl=document.getElementById("legend-wrap");
  legendEl.innerHTML=ids.map(id=>{
    const c=bathColor(Number(id));
    return `<div class="legend-item"><div class="legend-dot" style="background:${c}"></div>${groups[id].name}</div>`;
  }).join("");
}

// ── モーダル制御 ──────────────────────────────────
function closeModal(id){
  document.getElementById(id).classList.remove("open");
  document.body.style.overflow="";
}
document.querySelectorAll(".modal-backdrop").forEach(el=>{
  el.addEventListener("click",()=>{
    document.querySelectorAll(".modal.open").forEach(m=>m.classList.remove("open"));
    document.body.style.overflow="";
  });
});

// 個別履歴モーダル
async function openBathModal(bathId){
  const bath=bathsData.find(b=>b.id===bathId); if(!bath) return;
  const tgt=parseTarget(bath.target||""), st=calcStatus(bath.temp,bath.stale,tgt);
  const hasT=bath.temp!=null;
  document.getElementById("bath-modal-title").textContent=bath.name;
  document.getElementById("bath-modal-target").textContent=bath.target?`目標 ${bath.target}`:"";
  const curEl=document.getElementById("bath-modal-current");
  curEl.textContent=hasT?Number(bath.temp).toFixed(1)+"℃":"-- ℃";
  curEl.className=`td-${st.key}`;
  document.getElementById("bath-modal").classList.add("open");
  document.body.style.overflow="hidden";

  document.getElementById("bath-no-data").style.display="none";
  document.getElementById("bath-hist-table").style.display="";
  document.getElementById("bath-hist-tbody").innerHTML=
    `<tr><td colspan="3" style="color:var(--sub);text-align:center;padding:16px">読み込み中...</td></tr>`;
  document.getElementById("bath-chart").innerHTML="";

  try{
    const res=await fetch(`/api/history?id=${bathId}&n=100`), rows=await res.json();
    if(!rows.length){
      document.getElementById("bath-no-data").style.display="";
      document.getElementById("bath-hist-table").style.display="none";
      return;
    }
    drawSingleChart(document.getElementById("bath-chart"), rows, tgt, bathColor(bathId));
    const tbody=document.getElementById("bath-hist-tbody");
    tbody.innerHTML=[...rows].reverse().map(r=>{
      const st2=calcStatus(r.temp,r.stale,tgt);
      return `<tr>
        <td>${fmtShort(r.at)}</td>
        <td class="td-${st2.key}" style="font-weight:600">${r.temp!=null?Number(r.temp).toFixed(1)+"℃":"--"}</td>
        <td class="td-${st2.key}">${st2.label}</td>
      </tr>`;
    }).join("");
  }catch{
    document.getElementById("bath-hist-tbody").innerHTML=
      `<tr><td colspan="3" style="color:var(--ng);text-align:center;padding:16px">取得失敗</td></tr>`;
  }
}

// 全体グラフモーダル
async function openOverallModal(){
  document.getElementById("overall-modal").classList.add("open");
  document.body.style.overflow="hidden";
  document.getElementById("overall-no-data").style.display="none";
  document.getElementById("overall-chart").innerHTML="";
  document.getElementById("legend-wrap").innerHTML="";
  document.getElementById("overall-chart-label").textContent="読み込み中...";

  try{
    const res=await fetch("/api/history/all?n=300"), rows=await res.json();
    if(!rows.length){
      document.getElementById("overall-no-data").style.display="";
      document.getElementById("overall-chart-label").textContent="データがありません";
      return;
    }
    const from=fmtShort(rows[0].at), to=fmtShort(rows[rows.length-1].at);
    document.getElementById("overall-chart-label").textContent=`${from} 〜 ${to}`;
    drawOverallChart(document.getElementById("overall-chart"), rows);
  }catch{
    document.getElementById("overall-chart-label").textContent="取得失敗";
  }
}
