<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>湯畑 露天風呂 温度マップ</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:#0d140a;font-family:'Hiragino Kaku Gothic Pro','Yu Gothic',sans-serif;
    height:100vh;display:flex;flex-direction:column;}

  /* ── トップバー ── */
  #topbar{display:flex;align-items:stretch;background:rgba(10,18,8,.8);flex-shrink:0;}
  #topbar-l{flex:8;display:flex;align-items:center;justify-content:space-between;
    padding:5px 12px;}
  #topbar-r{flex:2;display:flex;align-items:center;justify-content:space-between;padding:5px 12px 5px 36px;}
  body::after{content:"";position:fixed;top:0;bottom:0;left:80%;width:1px;background:rgba(255,200,100,.18);pointer-events:none;z-index:100;}
  #topbar-r h2{color:#f0e6cf;font-size:1.8vw;letter-spacing:.1em;}
  #topbar-r h2 small{display:block;font-size:1.2vw;color:#b8a884;}
  #topbar h1{color:#f0e6cf;font-size:1.8vw;letter-spacing:.1em;}
  #topbar h1 small{display:block;font-size:1.2vw;color:#b8a884;}
  #info{display:flex;gap:6px;align-items:center;font-size:1.0vw;}
  #info .t{color:#ff9a5a;font-weight:bold;}
  #info .upd{color:#9aaa8a;font-size:1.0vw;}
  #info span:first-child{color:#f0e6cf;font-weight:bold;}
  .connbadge{font-size:0.85vw;font-weight:bold;padding:2px 6px;border-radius:10px;}
  .connbadge.ok{color:#8fe39a;background:rgba(40,120,60,.35);}
  .connbadge.warn{color:#ffd24a;background:rgba(150,110,20,.45);}
  .connbadge.ng{color:#ff8f7a;background:rgba(150,40,30,.5);
    animation:blink 1.4s ease-in-out infinite;}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.45}}

  /* ── メインエリア ── */
  #main-row{display:flex;flex:1;overflow:hidden;}

  /* ── 左: 露天風呂 ── */
  #wrap{position:relative;flex:8;overflow:hidden;background:#2c380b;}
  #wrap img{width:100%;height:100%;object-fit:cover;display:block;}
  .pin{position:absolute;transform:translate(-50%,-100%);
    background:var(--lc,rgba(10,16,8,.85));border:2px solid rgba(255,255,255,.6);
    border-radius:12px;padding:6px 12px;text-align:center;white-space:nowrap;
    box-shadow:0 3px 12px rgba(0,0,0,.5);pointer-events:none;}
  .pin::after{content:"";position:absolute;left:50%;top:100%;transform:translateX(-50%);
    border:6px solid transparent;border-top-color:var(--lc,rgba(10,16,8,.85));}
  .pin .nm{font-size:var(--pin-nm,1.6vw);color:#fff;font-weight:bold;}
  .pin .tp{font-size:var(--pin-tp,2.6vw);font-weight:800;color:#FFD700;}
  .pin.sm .nm{font-size:var(--pin-sm-nm,1.4vw);}
  .pin.sm .tp{font-size:var(--pin-sm-tp,2.2vw);color:#FFD700;}
  .pin.lg .nm{font-size:var(--pin-lg-nm,1.8vw);}
  .pin.lg .tp{font-size:var(--pin-lg-tp,3.0vw);color:#FFD700;}
  .line{position:absolute;transform:translateX(-50%);width:3px;
    background:rgba(255,255,255,0.55);pointer-events:none;}
  .pin.stale{border-style:dashed;opacity:.9;}
  .pin .old{font-size:.55vw;color:#ffd24a;font-weight:bold;display:block;}
  .dot{position:absolute;transform:translate(-50%,-50%);
    width:12px;height:12px;border-radius:50%;border:2px solid rgba(255,255,255,.7);}
  #yugata{position:absolute;transform:translate(-50%,-50%);
    font-size:2.9vw;font-weight:900;letter-spacing:.35em;white-space:nowrap;
    background:linear-gradient(180deg,#fff9e6 0%,#FFD700 45%,#FF6B00 100%);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
    filter:drop-shadow(0 0 18px rgba(255,180,0,.95)) drop-shadow(0 0 40px rgba(255,100,0,.6));
    animation:yugata-pulse 3s ease-in-out infinite;pointer-events:none;}
  @keyframes yugata-pulse{
    0%,100%{filter:drop-shadow(0 0 18px rgba(255,180,0,.95)) drop-shadow(0 0 40px rgba(255,100,0,.6));}
    50%{filter:drop-shadow(0 0 28px rgba(255,210,0,1)) drop-shadow(0 0 60px rgba(255,130,0,.8));}
  }
  #legend{position:absolute;transform:translate(-50%,-50%);
    width:max-content;
    background:rgba(10,18,8,.6);color:#dfd5b8;padding:10px 14px;
    border-radius:12px;font-size:0.9vw;}
  #legend .r{display:flex;gap:6px;align-items:center;margin:2px 0;white-space:nowrap;}
  #legend .d{width:10px;height:10px;border-radius:3px;}
  #legend .legend-row{display:flex;align-items:stretch;gap:10px;}
  #legend .gradbar{width:1.8vw;height:16vh;border-radius:8px;flex-shrink:0;}
  #legend .gradlabels{display:flex;flex-direction:column;justify-content:space-between;
    font-size:0.95vw;font-weight:bold;color:#f0e6cf;}

  /* ── 右: 大浴場 ── */
  #daiyokujo{
    flex:2;
    display:flex;
    flex-direction:column;
    background:#080f06;
  }
  #daiyu-cards{
    flex:1;
    display:flex;
    flex-direction:column;
    gap:12px;
    padding:16px 14px;
  }
  .bath-card{
    flex:1;
    background:var(--bc, rgba(45,72,28,.92));
    border:2px solid rgba(255,255,255,.6);
    border-radius:16px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:8px;
    position:relative;
    overflow:hidden;
  }
  .bath-card.stale{border-style:dashed;opacity:.85;}
  .bath-card .card-label{
    font-size:calc(1.4vw * var(--card-scale,1));color:#b8a884;font-weight:bold;letter-spacing:.12em;
  }
  .bath-card .card-name{
    font-size:calc(2.2vw * var(--card-scale,1));color:#f0e6cf;font-weight:900;letter-spacing:.08em;
  }
  .bath-card .card-temp{
    font-size:calc(3.5vw * var(--card-scale,1));font-weight:800;color:#FFD700;
    line-height:1;letter-spacing:.04em;
  }
  .bath-card .card-upd{
    font-size:calc(.85vw * var(--card-scale,1));color:#ffd24a;
  }
  #clock{
    padding:8px 16px;
    background:rgba(10,18,8,.8);
    color:#f0e6cf;font-weight:bold;letter-spacing:.06em;
    font-variant-numeric:tabular-nums;text-align:right;
    border-top:1px solid rgba(255,200,100,.1);
    flex-shrink:0;
  }
  #clock .date{font-size:1.6vw;display:block;color:#b8a884;margin-bottom:2px;}
  #clock .time{font-size:2.6vw;display:block;}
</style>
</head>
<body>

<div id="topbar">
  <div id="topbar-l">
    <h1>♨ 露天風呂「湯畑」温度マップ<small>山中温泉 花つばき</small></h1>
    <div id="info">
      <span>📍石川県加賀市</span>
      <span class="t" id="at">--.-℃</span>
      <span class="upd" id="upd"></span>
      <span id="conn" class="connbadge ok">🟢 接続中</span>
    </div>
  </div>
  <div id="topbar-r">
    <h2>♨ 大浴場<small>山中温泉 花つばき</small></h2>
    <span id="conn2" class="connbadge ok">🟢 接続中</span>
  </div>
</div>

<div id="main-row">

  <!-- ── 左: 露天風呂 ── -->
  <div id="wrap">
    <img src="/static/cut.png" id="photo" alt="湯畑"/>
    <div id="pins"></div>
    <div id="yugata">湯畑/Yubatake</div>
    <div id="legend">
      <div class="legend-row">
        <div id="legend-gradbar" class="gradbar"></div>
        <div class="gradlabels"><span>40℃+</span><span>28℃以下</span></div>
      </div>
    </div>
  </div>

  <!-- ── 右: 大浴場 ── -->
  <div id="daiyokujo">
    <div id="daiyu-cards">
      <div class="bath-card" id="card-20">
        <div class="card-label">男湯</div>
        <div class="card-name">大浴場</div>
        <div class="card-temp" id="temp-20">--.-℃</div>
        <div class="card-upd" id="upd-20"></div>
      </div>
      <div class="bath-card" id="card-21">
        <div class="card-label">女湯</div>
        <div class="card-name">大浴場</div>
        <div class="card-temp" id="temp-21">--.-℃</div>
        <div class="card-upd" id="upd-21"></div>
      </div>
    </div>
    <div id="clock">--:--:--</div>
  </div>

</div>

<script>
const EDIT_MODE=new URLSearchParams(location.search).has('edit');
// ── 露天風呂スポット定義 ──
const SPOTS = [
  { id:1, name:"高めの湯", u:0.188, v:0.578 },
  { id:2, name:"ぬるめの湯", u:0.318, v:0.540 },
  { id:3, name:"低めの湯", u:0.439, v:0.492 },
  { id:6, name:"立湯", u:0.643, v:0.455, lg:true },
  { id:5, name:"座湯", u:0.624, v:0.780, lg:true },
];

// ── 移動可能な表示要素（湯畑文字・温度範囲の表）──
const FLOATS = [
  { key:"yugata", name:"湯畑文字", u:0.213, v:0.211 },
  { key:"legend", name:"温度範囲", u:0.862, v:0.405 },
];

// ── ピン・大浴場カードの大きさ（CMSから調整）──
const PIN_SCALE = 1;
const CARD_SCALE = 1;
document.documentElement.style.setProperty('--card-scale', CARD_SCALE);

// ── 大浴場スポット定義 ──
const DAIYU_SPOTS = [
  { id:20, label:"男湯" },
  { id:21, label:"女湯" },
];

// 28℃以下は青固定、28〜40℃は橙(hue22)→深紅(hue-12)の暖色域だけで多段グラデーション。
// 紫・緑は一切使わない「温度計」らしい2段構成。
const TEMP_THRESHOLD = 28, TEMP_MAX = 40;
const HUE_BLUE = 210, SAT_BLUE = 85;
const HUE_WARM_START = 22, HUE_WARM_END = -12, SAT_WARM = 92;
const GRAD_LIGHT = 50;
function hslToRgb(h,s,l){
  s/=100; l/=100;
  const k=n=>(n+h/30)%12;
  const a=s*Math.min(l,1-l);
  const f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));
  return [255*f(0),255*f(8),255*f(4)];
}
function tempGradRgb(t){
  if(t<=TEMP_THRESHOLD) return hslToRgb(HUE_BLUE, SAT_BLUE, GRAD_LIGHT);
  const clamped=Math.min(TEMP_MAX, t);
  const f=(clamped-TEMP_THRESHOLD)/(TEMP_MAX-TEMP_THRESHOLD);
  const hue=HUE_WARM_START+(HUE_WARM_END-HUE_WARM_START)*f;
  return hslToRgb(hue, SAT_WARM, GRAD_LIGHT);
}
function tempColor(id, t){
  if(t==null) return 'rgba(90,100,86,.85)';
  const [r,g,b]=tempGradRgb(t);
  return `rgba(${r|0},${g|0},${b|0},.92)`;
}
function tempTextColor(t){
  return '#FFD700';
}

const DAIYU_IDS = new Set([20, 21]);
let tempMap={}, staleMap={}, atMap={}, isOnline=true;
let daiTempMap={}, daiStaleMap={}, daiAtMap={};

function fmtAt(iso){
  if(!iso) return '時刻不明';
  const d=new Date(iso), p=n=>String(n).padStart(2,'0');
  const now=new Date();
  const sameDay=d.getFullYear()===now.getFullYear()&&d.getMonth()===now.getMonth()&&d.getDate()===now.getDate();
  return sameDay?`${p(d.getHours())}:${p(d.getMinutes())}`:`${d.getMonth()+1}/${d.getDate()} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

// ── 露天風呂レンダリング ──
function render(){
  const wrap=document.getElementById('wrap');
  const img=document.getElementById('photo');
  const pinsEl=document.getElementById('pins');
  const iw=img.naturalWidth||1368, ih=img.naturalHeight||796;
  const bw=wrap.clientWidth, bh=wrap.clientHeight;
  const scale=Math.max(bw/iw, bh/ih);
  const dw=iw*scale, dh=ih*scale;
  const ox=(bw-dw)/2, oy=(bh-dh)/2;
  if(EDIT_MODE){window._eox=ox;window._eoy=oy;window._edw=dw;window._edh=dh;}

  // ピンサイズを画像の実表示幅に比例させる
  const p=dw/100;
  const r=document.documentElement;
  r.style.setProperty('--pin-nm',   (p*2.05*PIN_SCALE).toFixed(1)+'px');
  r.style.setProperty('--pin-tp',   (p*3.30*PIN_SCALE).toFixed(1)+'px');
  r.style.setProperty('--pin-sm-nm',(p*1.80*PIN_SCALE).toFixed(1)+'px');
  r.style.setProperty('--pin-sm-tp',(p*2.85*PIN_SCALE).toFixed(1)+'px');
  r.style.setProperty('--pin-lg-nm',(p*2.30*PIN_SCALE).toFixed(1)+'px');
  r.style.setProperty('--pin-lg-tp',(p*3.80*PIN_SCALE).toFixed(1)+'px');
  const lineH=Math.round(p*4.8);

  let html='';
  for(const s of SPOTS){
    const px=ox+s.u*dw, py=oy+s.v*dh;
    const t=tempMap[s.id];
    const lc=tempColor(s.id, t);
    const label=t!=null?`${Number(t).toFixed(1)}℃`:'-- ℃';
    const isStale=!isOnline||staleMap[s.id];
    html+=`<div class="dot" style="left:${px}px;top:${py}px;background:${lc}"></div>`;
    html+=`<div class="line" style="left:${px}px;top:${py-lineH}px;height:${lineH}px;background:${lc};opacity:.7"></div>`;
    html+=`<div class="pin${s.sm?' sm':s.lg?' lg':''}${isStale?' stale':''}" style="left:${px}px;top:${py-lineH}px;--lc:${lc}">
      <div class="nm">${s.name}</div>
      <div class="tp">${label}</div>
      ${isStale&&atMap[s.id]?`<span class="old">⚠ 最終 ${fmtAt(atMap[s.id])}</span>`:''}
    </div>`;
  }
  pinsEl.innerHTML=html;

  // 移動可能な表示要素（湯畑文字・温度範囲）の位置を反映
  for(const f of FLOATS){
    const el=document.getElementById(f.key);
    if(el){ el.style.left=(ox+f.u*dw)+'px'; el.style.top=(oy+f.v*dh)+'px'; }
  }

  if(EDIT_MODE && window.addEditHandles && !window._dragSpot) window.addEditHandles();
}

// ── 大浴場レンダリング ──
function renderDaiyu(){
  for(const s of DAIYU_SPOTS){
    const t=daiTempMap[s.id];
    const card=document.getElementById(`card-${s.id}`);
    const tempEl=document.getElementById(`temp-${s.id}`);
    const updEl=document.getElementById(`upd-${s.id}`);
    if(!card||!tempEl) continue;
    const label=t!=null?`${Number(t).toFixed(1)}℃`:'--.-℃';
    tempEl.textContent=label;
    tempEl.style.color=tempTextColor(t);
    card.style.setProperty('--bc', tempColor(s.id, t));
    const isStale=!isOnline||daiStaleMap[s.id];
    card.classList.toggle('stale', isStale);
    if(updEl) updEl.textContent=isStale&&daiAtMap[s.id]?`⚠ ${fmtAt(daiAtMap[s.id])}`:'';
  }
}

function setConn(online, anyStale){
  const el=document.getElementById('conn');
  if(!online){ el.className='connbadge ng'; el.textContent='🔴 未接続（表示は最終値）'; }
  else if(anyStale){ el.className='connbadge warn'; el.textContent='🟡 一部未取得'; }
  else{ el.className='connbadge ok'; el.textContent='🟢 接続中'; }
}

function setConn2(online, anyStale){
  const el=document.getElementById('conn2');
  if(!online){ el.className='connbadge ng'; el.textContent='🔴 未接続'; }
  else if(anyStale){ el.className='connbadge warn'; el.textContent='🟡 一部未取得'; }
  else{ el.className='connbadge ok'; el.textContent='🟢 接続中'; }
}

let lastUpdated=null, lastOnline=null, lastAttempt=null;
async function load(){
  try{
    const res=await fetch('/api/baths');
    const data=await res.json();
    const online=data.online!==false;
    if(data.last_updated===lastUpdated&&data.last_attempt===lastAttempt&&online===lastOnline) return;
    lastUpdated=data.last_updated; lastAttempt=data.last_attempt; lastOnline=online; isOnline=online;
    tempMap={}; staleMap={}; atMap={};
    daiTempMap={}; daiStaleMap={}; daiAtMap={};
    for(const b of data.baths){
      if(DAIYU_IDS.has(b.id)){
        daiTempMap[b.id]=b.temp; daiStaleMap[b.id]=b.stale; daiAtMap[b.id]=b.at;
      } else {
        tempMap[b.id]=b.temp; staleMap[b.id]=b.stale; atMap[b.id]=b.at;
      }
    }
    const anyStale=data.baths.filter(b=>!DAIYU_IDS.has(b.id)).some(b=>b.stale);
    const daiAnyStale=data.baths.filter(b=>DAIYU_IDS.has(b.id)).some(b=>b.stale);
    const amb=data.gateway;
    if(amb&&amb.temp!=null){
      document.getElementById('at').textContent=Number(amb.temp).toFixed(1)+'℃';
    }
    setConn(isOnline, anyStale);
    setConn2(isOnline, daiAnyStale);
    if(data.last_updated){
      const d=new Date(data.last_updated),p=n=>String(n).padStart(2,'0');
      const label=online?'最終更新':'最終取得';
      document.getElementById('upd').textContent=`${label} ${p(d.getHours())}:${p(d.getMinutes())}`;
    }
    render();
    renderDaiyu();
  }catch(e){
    isOnline=false; lastOnline=false; setConn(false); setConn2(false, false); render(); renderDaiyu();
  }
}

// ── 凡例グラデーションバー（実際の色分けと同じ関数で描画。閾値より少し下から表示）──
(function(){
  const LEGEND_MIN = TEMP_THRESHOLD - 4;
  const stops=[];
  for(let t=LEGEND_MIN;t<=TEMP_MAX;t+=1){
    const [r,g,b]=tempGradRgb(t);
    stops.push(`rgb(${r|0},${g|0},${b|0}) ${(t-LEGEND_MIN)/(TEMP_MAX-LEGEND_MIN)*100}%`);
  }
  document.getElementById('legend-gradbar').style.background=`linear-gradient(0deg, ${stops.join(',')})`;
})();

document.getElementById('photo').onload=render;
window.addEventListener('resize',render);
render();
load();
setInterval(load,10000);

function updateClock(){
  const d=new Date(), p=n=>String(n).padStart(2,'0');
  const days=['日','月','火','水','木','金','土'];
  const date=`${d.getFullYear()}/${p(d.getMonth()+1)}/${p(d.getDate())}（${days[d.getDay()]}）`;
  const time=`${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
  document.getElementById('clock').innerHTML=`<span class="date">${date}</span><span class="time">${time}</span>`;
}
updateClock();
setInterval(updateClock,1000);

// ── 編集モード ──
if(EDIT_MODE){
  window._dragSpot=null;

  // 操作パネル
  const ep=document.createElement('div');
  ep.style.cssText='position:fixed;bottom:10px;left:50%;transform:translateX(-50%);z-index:9999;background:rgba(0,0,0,.9);color:#fff;padding:12px 16px;border-radius:10px;font-size:12px;font-family:monospace;min-width:440px;border:2px solid #FFD700;';
  ep.innerHTML='<div style="font-weight:bold;color:#FFD700;margin-bottom:6px">📍 編集モード — 🟡金=湯 / 🔵水色=文字・表 をドラッグ<button id="ep-hide" style="float:right;padding:2px 8px;background:#444;color:#fff;border:1px solid #888;border-radius:5px;cursor:pointer;font-size:11px">隠す</button></div><div id="ep-body"><pre id="ep-out" style="margin:0;font-size:11px;color:#8fe39a;white-space:pre-wrap"></pre><button id="ep-copy" style="margin-top:8px;padding:4px 14px;background:#2d5a27;color:#fff;border:1px solid #6f9;border-radius:6px;cursor:pointer;font-size:12px">コピー</button></div>';
  document.body.appendChild(ep);
  document.getElementById('ep-hide').onclick=()=>{
    const b=document.getElementById('ep-body'), btn=document.getElementById('ep-hide');
    const hidden=b.style.display==='none';
    b.style.display=hidden?'block':'none';
    btn.textContent=hidden?'隠す':'表示';
    ep.style.minWidth=hidden?'440px':'0';
  };

  function epUpdate(){
    const lines=SPOTS.map(s=>`  { id:${s.id}, name:"${s.name}",${s.lg?' lg:true,':s.sm?' sm:true,':''} u:${s.u.toFixed(3)}, v:${s.v.toFixed(3)} },`);
    const flines=FLOATS.map(f=>`  { key:"${f.key}", name:"${f.name}", u:${f.u.toFixed(3)}, v:${f.v.toFixed(3)} },`);
    document.getElementById('ep-out').textContent=
      'const SPOTS = [\n'+lines.join('\n')+'\n];\n\n'+
      'const FLOATS = [\n'+flines.join('\n')+'\n];';
  }
  document.getElementById('ep-copy').onclick=()=>{
    navigator.clipboard.writeText(document.getElementById('ep-out').textContent).then(()=>{
      const b=document.getElementById('ep-copy');
      b.textContent='✓ コピー済み'; setTimeout(()=>b.textContent='コピー',1500);
    });
  };
  window._epUpdate=epUpdate;

  // ハンドルを現在の座標に描画（毎render時に呼ばれる）
  window.addEditHandles=function(){
    const wrap=document.getElementById('wrap');
    const ox=window._eox||0, oy=window._eoy||0, dw=window._edw||1, dh=window._edh||1;
    let cont=document.getElementById('ehandles');
    if(!cont){
      cont=document.createElement('div');
      cont.id='ehandles';
      cont.style.cssText='position:absolute;inset:0;z-index:600;';
      wrap.appendChild(cont);
    }
    cont.innerHTML='';
    const mk=(obj,kind,color)=>{
      const px=ox+obj.u*dw, py=oy+obj.v*dh;
      const h=document.createElement('div');
      h.className='ehandle';
      h.dataset.kind=kind;
      h.dataset.key=(kind==='spot'?obj.id:obj.key);
      h.style.cssText=`position:absolute;left:${px}px;top:${py}px;width:28px;height:28px;border-radius:50%;background:${color};border:3px solid #fff;transform:translate(-50%,-50%);cursor:grab;box-shadow:0 0 12px rgba(0,0,0,.8);`;
      h.title=obj.name;
      cont.appendChild(h);
    };
    for(const s of SPOTS) mk(s,'spot','rgba(255,215,0,.9)');
    for(const f of FLOATS) mk(f,'float','rgba(0,200,255,.9)');
  };

  // ドラッグ操作（イベントは一度だけ登録）
  const wrap=document.getElementById('wrap');
  wrap.addEventListener('mousedown',e=>{
    const h=e.target.closest('.ehandle');
    if(!h) return;
    e.preventDefault();
    window._dragSpot = h.dataset.kind==='spot'
      ? SPOTS.find(s=>String(s.id)===h.dataset.key)
      : FLOATS.find(f=>f.key===h.dataset.key);
    h.style.cursor='grabbing'; h.style.opacity='.55';
  });
  window.addEventListener('mousemove',e=>{
    const s=window._dragSpot;
    if(!s) return;
    const rect=wrap.getBoundingClientRect();
    const ox=window._eox||0,oy=window._eoy||0,dw=window._edw||1,dh=window._edh||1;
    s.u=Math.max(0,Math.min(1,(e.clientX-rect.left-ox)/dw));
    s.v=Math.max(0,Math.min(1,(e.clientY-rect.top-oy)/dh));
    window.addEditHandles();  // ハンドルだけ更新（render()は呼ばない）
    epUpdate();
    // ピン表示も追従させたいので pins だけ再描画
    render();
  });
  window.addEventListener('mouseup',()=>{ window._dragSpot=null; });

  epUpdate();
  render();            // _eox 等を確定
  window.addEditHandles();  // ハンドル初回描画
}
</script>
</body>
</html>
