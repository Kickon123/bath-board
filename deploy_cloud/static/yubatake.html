<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>湯畑 露天風呂 温度マップ</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:#0d140a;font-family:'Hiragino Kaku Gothic Pro','Yu Gothic',sans-serif;
    height:100vh;display:flex;flex-direction:column;}
  #topbar{display:flex;align-items:center;justify-content:space-between;
    padding:8px 16px;background:rgba(10,18,8,.8);flex-shrink:0;}
  #topbar h1{color:#f0e6cf;font-size:1.8vw;letter-spacing:.1em;}
  #topbar h1 small{display:block;font-size:1.2vw;color:#b8a884;}
  #info{display:flex;gap:12px;align-items:center;font-size:1.75vw;}
  #info .t{color:#ff9a5a;font-weight:bold;}
  #info .h{color:#7ab8e0;}
  #info .upd{color:#9aaa8a;font-size:1.8vw;}
  #info span:first-child{color:#f0e6cf;font-weight:bold;}
  #conn{font-size:1.25vw;font-weight:bold;padding:2px 9px;border-radius:10px;}
  #conn.ok{color:#8fe39a;background:rgba(40,120,60,.35);}
  #conn.warn{color:#ffd24a;background:rgba(150,110,20,.45);}
  #conn.ng{color:#ff8f7a;background:rgba(150,40,30,.5);
    animation:blink 1.4s ease-in-out infinite;}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.45}}
  #wrap{position:relative;flex:1;overflow:hidden;background:#2c380b;}
  #wrap img{width:100%;height:100%;object-fit:cover;display:block;}
  .pin{position:absolute;transform:translate(-50%,-100%);
    background:var(--lc,rgba(10,16,8,.85));border:2px solid rgba(255,255,255,.6);
    border-radius:10px;padding:4px 10px;text-align:center;white-space:nowrap;
    box-shadow:0 3px 12px rgba(0,0,0,.5);pointer-events:none;}
  .pin::after{content:"";position:absolute;left:50%;top:100%;transform:translateX(-50%);
    border:5px solid transparent;border-top-color:var(--lc,rgba(10,16,8,.85));}
  .pin .nm{font-size:1.4vw;color:#fff;font-weight:bold;}
  .pin .tp{font-size:2.2vw;font-weight:800;color:#FFD700;}
  .pin.sm .nm{font-size:1.3vw;}
  .pin.sm .tp{font-size:1.8vw;color:#FFD700;}
  .line{position:absolute;transform:translateX(-50%);width:4px;
    background:rgba(255,255,255,0.55);pointer-events:none;}
  .pin.stale{border-style:dashed;opacity:.9;}
  .pin .old{font-size:.55vw;color:#ffd24a;font-weight:bold;display:block;}
  .dot{position:absolute;transform:translate(-50%,-50%);
    width:12px;height:12px;border-radius:50%;border:2px solid rgba(255,255,255,.7);}
  #right-panel{position:absolute;right:20px;top:50%;transform:translateY(-50%);
    display:flex;flex-direction:column;gap:14px;align-items:flex-end;}
  #yugata{font-size:3.5vw;font-weight:900;letter-spacing:.35em;
    background:linear-gradient(180deg,#fff9e6 0%,#FFD700 45%,#FF6B00 100%);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
    filter:drop-shadow(0 0 18px rgba(255,180,0,.95)) drop-shadow(0 0 40px rgba(255,100,0,.6));
    animation:yugata-pulse 3s ease-in-out infinite;pointer-events:none;}
  @keyframes yugata-pulse{
    0%,100%{filter:drop-shadow(0 0 18px rgba(255,180,0,.95)) drop-shadow(0 0 40px rgba(255,100,0,.6));}
    50%{filter:drop-shadow(0 0 28px rgba(255,210,0,1)) drop-shadow(0 0 60px rgba(255,130,0,.8));}
  }
  #legend{background:rgba(10,18,8,.6);color:#dfd5b8;padding:9px 14px;
    border-radius:9px;font-size:1.0vw;}
  #legend .r{display:flex;gap:8px;align-items:center;margin:3px 0;}
  #legend .d{width:14px;height:14px;border-radius:4px;}
  #clock{background:rgba(10,18,8,.75);color:#f0e6cf;padding:8px 16px;
    border-radius:9px;font-weight:bold;letter-spacing:.06em;
    font-variant-numeric:tabular-nums;text-align:right;}
  #clock .date{font-size:2.0vw;display:block;color:#b8a884;margin-bottom:2px;}
  #clock .time{font-size:3.2vw;display:block;}
</style>
</head>
<body>
<div id="topbar">
  <h1>♨ 露天風呂「湯畑」温度マップ<small>山中温泉 花つばき</small></h1>
  <div id="info">
    <span>📍石川県加賀市</span>
    <span class="t" id="at">--.-℃</span>
    <span class="upd" id="upd"></span>
    <span id="conn" class="ok">🟢 接続中</span>
  </div>
</div>
<div id="wrap">
  <img src="/static/yubatake.png" id="photo" alt="湯畑"/>
  <div id="pins"></div>
  <div id="right-panel">
    <div id="yugata">湯畑/Yubatake</div>
    <div id="clock">--:--:--</div>
    <div id="legend">
      <div class="r"><span class="d" style="background:#9b1111"></span>40℃以上</div>
      <div class="r"><span class="d" style="background:#d64034"></span>36〜40℃</div>
      <div class="r"><span class="d" style="background:#e07a5f"></span>36℃未満</div>
      <div class="r"><span class="d" style="background:#3a90d8"></span>立湯・座湯</div>
    </div>
  </div>
</div>

<script>
// yubatake.png (1514x781) 上の各湯舟の位置 (u:左0→右1, v:上0→下1)
const SPOTS = [
  { id:1, name:"高めの湯",  u:0.16, v:0.57 },
  { id:2, name:"ぬるめの湯",u:0.25, v:0.55 },
  { id:3, name:"低めの湯",  u:0.35, v:0.49 },
  { id:6, name:"立湯",      u:0.51, v:0.48 },
  { id:5, name:"座湯",      u:0.49, v:0.75 },
];

const MARKERS = [];

const BLUE_ONLY = new Set([5, 6]);
function tempColor(id, t){
  if(t==null) return 'rgba(90,100,86,.85)';
  if(BLUE_ONLY.has(id)) return 'rgba(58,144,216,.9)';
  if(t>=40) return 'rgba(155,17,17,.92)';
  if(t>=36) return 'rgba(214,64,52,.92)';
  return 'rgba(224,122,95,.92)';
}

let tempMap={}, staleMap={}, atMap={}, isOnline=true;

function fmtAt(iso){
  if(!iso) return '時刻不明';
  const d=new Date(iso), p=n=>String(n).padStart(2,'0');
  const now=new Date();
  const sameDay=d.getFullYear()===now.getFullYear()&&d.getMonth()===now.getMonth()&&d.getDate()===now.getDate();
  return sameDay?`${p(d.getHours())}:${p(d.getMinutes())}`:`${d.getMonth()+1}/${d.getDate()} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

function render(){
  const wrap=document.getElementById('wrap');
  const img=document.getElementById('photo');
  const pinsEl=document.getElementById('pins');
  const iw=img.naturalWidth||1514, ih=img.naturalHeight||781;
  const bw=wrap.clientWidth, bh=wrap.clientHeight;
  const scale=Math.max(bw/iw, bh/ih);
  const dw=iw*scale, dh=ih*scale;
  const ox=(bw-dw)/2, oy=(bh-dh)/2;

  let html='';
  for(const s of SPOTS){
    const px=ox+s.u*dw, py=oy+s.v*dh;
    const t=tempMap[s.id];
    const lc=tempColor(s.id, t);
    const label=t!=null?`${Number(t).toFixed(1)}℃`:'-- ℃';
    const isStale=!isOnline||staleMap[s.id];
    html+=`<div class="dot" style="left:${px}px;top:${py}px;background:${lc}"></div>`;
    html+=`<div class="line" style="left:${px}px;top:${py-70}px;height:70px;background:${lc};opacity:.7"></div>`;
    html+=`<div class="pin${s.sm?' sm':''}${isStale?' stale':''}" style="left:${px}px;top:${py-70}px;--lc:${lc}">
      <div class="nm">${s.name}</div>
      <div class="tp">${label}</div>
      ${isStale?`<span class="old">⚠ 最終 ${fmtAt(atMap[s.id])}</span>`:''}
    </div>`;
  }
  pinsEl.innerHTML=html;
}

function setConn(online, anyStale){
  const el=document.getElementById('conn');
  if(!online){ el.className='ng'; el.textContent='🔴 未接続（表示は最終値）'; }
  else if(anyStale){ el.className='warn'; el.textContent='🟡 一部未取得（最終値表示あり）'; }
  else{ el.className='ok'; el.textContent='🟢 接続中'; }
}

let lastUpdated=null, lastOnline=null, lastAttempt=null;
async function load(){
  try{
    const res=await fetch('/api/baths');
    const data=await res.json();
    const online = data.online !== false;
    if(data.last_updated===lastUpdated&&data.last_attempt===lastAttempt&&online===lastOnline) return;
    lastUpdated=data.last_updated; lastAttempt=data.last_attempt; lastOnline=online; isOnline=online;
    tempMap={}; staleMap={}; atMap={};
    for(const b of data.baths){ tempMap[b.id]=b.temp; staleMap[b.id]=b.stale; atMap[b.id]=b.at; }
    // 湯畑(yubatake)は露天風呂のみ表示。男湯/女湯など非表示の湯舟のstaleで「一部未取得」にしない
    const shownIds=new Set(SPOTS.map(s=>s.id));
    const anyStale=data.baths.some(b=>shownIds.has(b.id)&&b.stale);
    const amb=data.gateway;
    if(amb&&amb.temp!=null){
      document.getElementById('at').textContent=Number(amb.temp).toFixed(1)+'℃';
    }
    setConn(isOnline, anyStale);
    if(data.last_updated){
      const d=new Date(data.last_updated),p=n=>String(n).padStart(2,'0');
      const label=online?'最終更新':'最終取得';
      document.getElementById('upd').textContent=`${label} ${p(d.getHours())}:${p(d.getMinutes())}`;
    }
    render();
  }catch(e){
    isOnline=false; lastOnline=false; setConn(false); render();
  }
}

document.getElementById('photo').onload=render;
window.addEventListener('resize',render);
render();
load();
setInterval(load,10000);

function updateClock(){
  const d=new Date(), p=n=>String(n).padStart(2,'0');
  const days=['日','月','火','水','木','金','土'];
  const date=`${d.getFullYear()}/${p(d.getMonth()+1)}/${p(d.getDate())}（${days[d.getDay()]}）`;
  const time=`${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
  document.getElementById('clock').innerHTML=`<span class="date">${date}</span><span class="time">${time}</span>`;
}
updateClock();
setInterval(updateClock,1000);
</script>
</body>
</html>
